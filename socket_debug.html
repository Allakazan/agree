<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Socket.IO Chat</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
        background: #f4f4f4;
      }
      #messages {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #ccc;
        background: #fff;
        max-height: 300px;
        overflow-y: auto;
      }
      .message {
        margin-bottom: 0.5rem;
      }
    </style>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <h2>Socket.IO Message App 💌</h2>

    <div>
      <input type="text" id="tokenInput" placeholder="JWT (POST /auth/login)" />
      <button id="connectButton">Connect</button>
      <span id="status">disconnected</span>
    </div>

    <input type="text" id="messageInput" placeholder="Type your message..." />
    <button id="sendButton">Send</button>

    <div id="messages"></div>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script>
      const input = document.getElementById('messageInput');
      const button = document.getElementById('sendButton');
      const tokenInput = document.getElementById('tokenInput');
      const connectButton = document.getElementById('connectButton');
      const statusSpan = document.getElementById('status');
      const messagesDiv = document.getElementById('messages');

      const channelId = '6888ef43224fe720e5a48fbd';
      let socket = null;

      // The gateway authenticates at the handshake now — an anonymous socket
      // is disconnected immediately, so the token has to be supplied here.
      function connect() {
        const token = tokenInput.value.trim();
        if (!token) return;

        if (socket) socket.disconnect();
        // Mesma porta da API: o gateway está anexado ao servidor HTTP do Nest.
        socket = io('http://127.0.0.1:3000/chat', { auth: { token } });

        socket.on('connect', () => {
          statusSpan.textContent = 'connected';
          // Broadcasts are room-scoped: without this the socket receives
          // nothing for the channel, not even its own messages.
          socket.emit('subscribe', { channelId }, (ack) =>
            console.log('subscribe ack:', ack),
          );
        });

        socket.on('disconnect', () => {
          statusSpan.textContent = 'disconnected';
        });

        socket.on(`channel:${channelId}:messages`, (msg) => {
          const div = document.createElement('div');
          div.classList.add('message');
          div.textContent = `${msg.senderUsername}: ${msg.content}`;
          messagesDiv.appendChild(div);
        });

        socket.on('error', (err) => {
          console.error('Erro do servidor:', err);
          Toastify({
            text: `Error: ${err.message} ${(err.errors ?? []).reduce((acc, error) => `${acc} - ${JSON.stringify(error)}`, '')}`,
            backgroundColor: 'red',
            duration: 3000,
          }).showToast();
        });
      }

      connectButton.addEventListener('click', connect);

      // Emit message to server on button click
      button.addEventListener('click', () => {
        const msg = input.value.trim();
        if (msg && socket) {
          socket.emit('chat', { message: msg, channelId });
          input.value = '';
        }
      });
    </script>
  </body>
</html>
